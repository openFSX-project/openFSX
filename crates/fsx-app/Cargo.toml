[package]
name = "fsx-app"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
fsx-vehicle.workspace = true
fsx-sim.workspace = true
fsx-model.workspace = true
fsx-geometry.workspace = true
serde_json.workspace = true
fsx-render = { workspace = true, optional = true }
winit = { workspace = true, optional = true }

[target.'cfg(windows)'.dependencies]
fsx-ui = { workspace = true, optional = true }

[features]
viewer = ["dep:fsx-render", "dep:winit", "dep:fsx-ui"]

[[bin]]
name = "openfsx-viewer"
path = "src/main.rs"
required-features = ["viewer"]

[[example]]
name = "flight-pose-check"
required-features = ["viewer"]

[[example]]
name = "flight-view-check"
required-features = ["viewer"]

[dev-dependencies]
fsx-vehicle = { workspace = true, features = ["test-support"] }

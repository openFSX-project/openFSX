[package]
name = "openfsx"
version = "0.1.0"
edition = "2021"
publish = false
description = "Experimental FSX content inspection tools; foundation for an independent runtime"
default-run = "openfsx"

[dependencies]
wgpu = { version = "24.0.5", optional = true, default-features = false, features = ["dx12", "wgsl"] }
winit = { version = "0.30.13", optional = true }

[features]
viewer = ["dep:wgpu", "dep:winit"]

[[bin]]
name = "openfsx-viewer"
path = "src/bin/viewer.rs"
required-features = ["viewer"]

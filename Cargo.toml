[workspace]
resolver = "2"
members = [
    "crates/fsx-cfg",
    "crates/fsx-geometry",
    "crates/fsx-script",
    "crates/fsx-model",
    "crates/fsx-texture",
    "crates/fsx-vehicle",
    "crates/fsx-scenery",
    "crates/fsx-sim",
    "crates/fsx-render",
    "crates/fsx-ui",
    "crates/fsx-app",
    "tools/fsx-check",
]
default-members = ["tools/fsx-check"]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[workspace.dependencies]
fsx-cfg = { path = "crates/fsx-cfg" }
fsx-geometry = { path = "crates/fsx-geometry" }
fsx-script = { path = "crates/fsx-script" }
fsx-model = { path = "crates/fsx-model" }
fsx-texture = { path = "crates/fsx-texture" }
fsx-vehicle = { path = "crates/fsx-vehicle" }
fsx-scenery = { path = "crates/fsx-scenery" }
fsx-sim = { path = "crates/fsx-sim" }
fsx-render = { path = "crates/fsx-render" }
fsx-ui = { path = "crates/fsx-ui" }
fsx-app = { path = "crates/fsx-app" }
wgpu = { version = "24.0.5", default-features = false, features = ["dx12", "wgsl"] }
winit = "0.30.13"
cpal = "0.15.3"
gilrs = { version = "0.11.0", default-features = false, features = ["xinput"] }
wry = "0.57.0"
serde_json = { version = "1.0", features = ["float_roundtrip"] }

name: Rust checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo test --workspace --locked
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-architecture.mjs
      - run: node scripts/build-site.mjs --check
  windows-viewer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --all-features --locked
      - run: cargo build --locked -p fsx-app --features viewer --bin openfsx-viewer
      - name: Build and check independent reference reader
        shell: pwsh
        run: ./scripts/build-reference.ps1
      - name: Build and check passive window capture
        shell: pwsh
        run: ./scripts/build-capture.ps1
